[package]
name = "cairn"
version = "0.5.1"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_Security", "Win32_UI_Controls", "Foundation_Numerics", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security_Cryptography", "implement", "Win32_System_SystemServices", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_Graphics_Imaging"] }
windows-core = "0.58"
# Zips in-process, with deflate only (pure Rust).
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
